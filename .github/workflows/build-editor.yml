name: build-editor

# Builds the standalone GoalKick Editor for Windows (and Linux) on real runners -
# PyInstaller cannot cross-compile - and uploads them to a release. The editor
# source lives in the private goalkick-editor repo, checked out with a token.
#
# Run it by hand (Actions tab -> build-editor -> Run workflow), giving the tag
# to attach to, e.g. v0.9.2-alpha. Public repo, so the runners are free.
#
# Needs one secret: EDITOR_REPO_TOKEN - a token that can read goalkick-editor.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the editor to"
        required: true
        default: "v0.9.2-alpha"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the editor source
        uses: actions/checkout@v4
        with:
          repository: goalkick-game/goalkick-editor
          token: ${{ secrets.EDITOR_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: python build_standalone.py
      - name: Rename
        run: Copy-Item dist/GoalKickEditor.exe GoalKickEditor-windows-x86_64.exe
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" GoalKickEditor-windows-x86_64.exe --repo ${{ github.repository }} --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the editor source
        uses: actions/checkout@v4
        with:
          repository: goalkick-game/goalkick-editor
          token: ${{ secrets.EDITOR_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: python build_standalone.py
      - name: Rename
        run: cp dist/GoalKickEditor GoalKickEditor-linux-x86_64
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" GoalKickEditor-linux-x86_64 --repo ${{ github.repository }} --clobber
